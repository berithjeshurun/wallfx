[package]
name = "wallfx"
version = "0.1.0"
edition = "2021"
description = "Memory-safe live wallpaper engine for Windows"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = { version = "0.30", default-features = false }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
zstd = "0.14.4"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
